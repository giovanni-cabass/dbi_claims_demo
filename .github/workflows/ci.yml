name: CI

on:
  push:
  pull_request:

jobs:
  check-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate claims ledger
        run: python python_scripts/check_claims.py
      - name: Regenerate views
        run: python python_scripts/generate_views.py
